name: Build AudioMix IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 9.6.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q gradle-9.6.0-bin.zip
          echo "$PWD/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioMixIPTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
