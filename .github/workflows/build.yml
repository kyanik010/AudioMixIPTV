name: Build AudioMix IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.6.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q gradle-9.6.0-bin.zip
          echo "$PWD/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioMixIPTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
