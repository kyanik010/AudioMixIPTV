name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout official Lantern SDK
        uses: actions/checkout@v4
        with:
          repository: getlantern/lanternsdk-android
          ref: v1.0.1
          path: .lanternsdk

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.22.4"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build official Lantern SDK AAR
        working-directory: .lanternsdk
        run: make build-sdk

      - name: Install Lantern SDK AAR
        run: |
          mkdir -p app/libs
          cp .lanternsdk/build/lanternsdk-android.aar app/libs/lanternsdk-android.aar

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-IPTV-debug
          path: app/build/outputs/apk/debug/*.apk

# verified dual-source build
